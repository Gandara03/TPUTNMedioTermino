spring:
  application:
    name: api-fintech
  datasource:
    url: jdbc:mysql://localhost:3306/fintech?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:

      ddl-auto: update

    show-sql: true
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true
  jackson:
    serialization:
      indent-output: true

# Documentacion de la API en http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
