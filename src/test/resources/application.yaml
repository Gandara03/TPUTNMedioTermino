# Configuracion SOLO para los tests: usan H2 en memoria,
# asi no hace falta tener MySQL levantado para correrlos.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # create-drop: crea las tablas al empezar y las borra al terminar.
      ddl-auto: create-drop
